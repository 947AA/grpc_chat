syntax = "proto3";

package computer_message;

import "proto/memory_message.proto";

option go_package = "grpc_chat/proto";

message cpu{
    string brand = 1;
    string name = 2;
    uint32 Croes = 3;
    uint32 threads = 4;
    float min_ghz = 5;
    float max_ghz = 6;
}

message GPU {
    string brand = 1;
    string name = 2;
    double min_ghz = 3;
    double max_ghz = 4;
    memory_message.Memory memory = 5;
  }